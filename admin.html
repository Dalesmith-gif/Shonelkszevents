<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShonellesEZevents Admin</title><link rel="stylesheet" href="styles.css">
<style>
.admin{max-width:1100px;margin:35px auto;padding:20px}.admin h1{font-family:Georgia,serif;color:#8b2759}
.panel{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 18px #0001;margin:16px 0}
.grid{display:grid;grid-template-columns:1fr 110px 1fr;gap:10px}.grid input,.login input{padding:11px;border:1px solid #bbb;border-radius:8px;width:100%;box-sizing:border-box}
.row{padding:15px 0;border-bottom:1px solid #ddd}.row textarea{width:100%;min-height:60px;padding:10px;box-sizing:border-box}
button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer}.primary{background:#8b2759;color:#fff}.secondary{background:#eee}.status{font-weight:700;margin:10px 0}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="admin">
<h1>ShonellesEZevents Admin</h1>
<section id="login" class="panel login">
<h2>Administrator Sign In</h2>
<p><input id="email" type="email" placeholder="Admin email"></p>
<p><input id="password" type="password" placeholder="Password"></p>
<button class="primary" id="signin">Sign in</button><p id="loginmsg"></p>
</section>
<section id="dashboard" hidden>
<div class="panel"><strong id="who"></strong> <button class="secondary" id="signout">Sign out</button></div>
<div class="panel">
<h2>Products</h2>

<div id="rows"></div>

<p>
<button class="primary" id="save">Save all changes</button>
<button class="secondary" id="showAddProduct">+ Add New Product</button>
</p>

<p class="status" id="saveStatus"></p>

<div id="addProductPanel" class="row" hidden>
<h3>Add New Product</h3>

<div class="grid">
<input id="newName" placeholder="Product name">
<input id="newPrice" type="number" step=".01" min="0" placeholder="Base price">
<input id="newPriceLabel" placeholder="Price wording, e.g. Designs $15">
</div>

<p>
<textarea id="newDescription" placeholder="Product description"></textarea>
</p>
<p>
<label><strong>Product image</strong></label><br>
<input id="newImage" type="file" accept="image/jpeg,image/png,image/webp">
</p>
<label>
<input id="newAvailable" type="checkbox" checked>
Available for sale
</label>

<p>
<button class="primary" id="createProduct">Add Product</button>
<button class="secondary" id="cancelAddProduct">Cancel</button>
</p>

<p class="status" id="addProductStatus"></p>
</div>
</div>
<div class="panel"><h2>Orders</h2><button class="secondary" id="refreshOrders">Refresh orders</button><div id="orders"></div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="site-config.js"></script>
<script>
const db=window.supabase.createClient(SEZ_CONFIG.supabaseUrl,SEZ_CONFIG.supabaseAnonKey);
const login=document.getElementById('login'), dashboard=document.getElementById('dashboard'),
rows=document.getElementById('rows'), saveStatus=document.getElementById('saveStatus'),
email=document.getElementById('email'), password=document.getElementById('password'),
signin=document.getElementById('signin'), signout=document.getElementById('signout'),
save=document.getElementById('save'), loginmsg=document.getElementById('loginmsg'),
who=document.getElementById('who'), orders=document.getElementById('orders'),
refreshOrders=document.getElementById('refreshOrders');
let items=[];
async function sessionUI(){
 const {data:{session}}=await db.auth.getSession();
 login.hidden=!!session; dashboard.hidden=!session;
 if(session){who.textContent="Signed in: "+session.user.email; await load(); await loadOrders();}
}
async function load(){
 saveStatus.textContent="Loading…";
 const {data,error}=await db.from('products').select('*').order('sort_order');
 if(error){saveStatus.textContent=error.message;return}
 items=data; draw(); saveStatus.textContent="";
}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function draw(){rows.innerHTML=items.map((p,i)=>`<div class="row">
<div class="grid">
<input data-i="${i}" data-k="name" value="${esc(p.name)}" aria-label="Product name">
<input data-i="${i}" data-k="price" type="number" step=".01" value="${p.price}" aria-label="Price">
<input data-i="${i}" data-k="price_label" value="${esc(p.price_label)}" aria-label="Price label">
</div>
<p><textarea data-i="${i}" data-k="description" aria-label="Description">${esc(p.description)}</textarea></p>
<label><input data-i="${i}" data-k="available" type="checkbox" ${p.available?'checked':''}> Available for sale</label>

<p>
<strong>Product image:</strong><br>
${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" style="width:100px;height:100px;object-fit:cover;border-radius:10px;margin:8px 0">` : `<span>No image uploaded</span>`}
</p>

<p>
<input type="file" class="productImageFile" data-i="${i}" accept="image/jpeg,image/png,image/webp">
<button type="button" class="secondary uploadProductImage" data-i="${i}">Upload / Change Image</button>
<span class="imageUploadStatus" data-i="${i}"></span>
</p>

</div>
</div>`).join('')}
rows.addEventListener('input',e=>{let i=e.target.dataset.i,k=e.target.dataset.k;if(k){items[i][k]=k==='price'?Number(e.target.value):k==='available'?e.target.checked:e.target.value}})
rows.addEventListener('change',e=>{if(e.target.dataset.k==='available')items[e.target.dataset.i].available=e.target.checked})
signin.onclick=async()=>{loginmsg.textContent="Signing in…";const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});loginmsg.textContent=error?error.message:"";if(!error)sessionUI()}
signout.onclick=async()=>{await db.auth.signOut();sessionUI()}
save.onclick=async()=>{saveStatus.textContent="Saving…";for(const p of items){const {error}=await db.from('products').update({name:p.name,price:p.price,price_label:p.price_label,description:p.description,available:p.available,updated_at:new Date().toISOString()}).eq('id',p.id);if(error){saveStatus.textContent="Error: "+error.message;return}}saveStatus.textContent="Saved successfully."}

async function loadOrders(){
 orders.innerHTML="<p>Loading orders…</p>";
 const {data,error}=await db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});
 if(error){orders.innerHTML="<p>"+error.message+"</p>";return}
 if(!data.length){orders.innerHTML="<p>No orders yet.</p>";return}
 orders.innerHTML=data.map(o=>`<div class="admin-order">
 <strong>${o.order_number}</strong> — ${new Date(o.created_at).toLocaleString()}<br>
 ${o.customer_name} · ${o.contact}<br>
 Items: ${(o.order_items||[]).map(i=>i.product_name).join(", ")}<br>
 Estimated total: $${Number(o.estimated_total).toFixed(2)}<br>
<strong>Payment: ${esc(o.payment_status || "Not started")}</strong><br>
 Customization: ${o.customization||"—"}<br>
 Fulfillment: ${o.fulfillment||"—"}<br>
 <label>Status <select class="orderStatus" data-id="${o.id}">
 ${['New','Awaiting Payment','Paid','In Production','Ready','Shipped/Completed','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
 </select></label>
 </div>`).join("");
 document.querySelectorAll(".orderStatus").forEach(el=>el.onchange=async()=>{
   const {error}=await db.from('orders').update({status:el.value,updated_at:new Date().toISOString()}).eq('id',el.dataset.id);
   if(error) alert(error.message);
 });
}
refreshOrders.onclick=loadOrders;
rows.addEventListener('click', async e => {
  if (!e.target.classList.contains('uploadProductImage')) return;

  const i = Number(e.target.dataset.i);
  const product = items[i];
  const productRow = e.target.closest('.row');
  const fileInput = productRow.querySelector('.productImageFile');
  const statusEl = productRow.querySelector('.imageUploadStatus');
  const file = fileInput.files[0];

  if (!file) {
    statusEl.textContent = " Please choose an image first.";
    return;
  }

  if (!['image/jpeg','image/png','image/webp'].includes(file.type)) {
    statusEl.textContent = " Please choose a JPG, PNG, or WebP image.";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    statusEl.textContent = " Image must be 5 MB or smaller.";
    return;
  }

  e.target.disabled = true;
  statusEl.textContent = " Uploading…";

  const extension = file.name.split('.').pop().toLowerCase();
  const safeId = String(product.id).replace(/[^a-zA-Z0-9_-]/g, '_');
  const filePath = `${safeId}-${Date.now()}.${extension}`;

  const { error: uploadError } = await db.storage
    .from('product-images')
    .upload(filePath, file, {
      cacheControl: '3600',
      upsert: false,
      contentType: file.type
    });

  if (uploadError) {
    e.target.disabled = false;
    statusEl.textContent = " Upload error: " + uploadError.message;
    return;
  }

  const { data: publicData } = db.storage
    .from('product-images')
    .getPublicUrl(filePath);

  const imageUrl = publicData.publicUrl;

  const { error: updateError } = await db
    .from('products')
    .update({
      image: imageUrl,
      updated_at: new Date().toISOString()
    })
    .eq('id', product.id);

  e.target.disabled = false;

  if (updateError) {
    statusEl.textContent = " Database error: " + updateError.message;
    return;
  }

product.image = imageUrl;
statusEl.textContent = " Image uploaded successfully.";
setTimeout(() => draw(), 1000);
}); 
const showAddProduct=document.getElementById('showAddProduct');
const addProductPanel=document.getElementById('addProductPanel');
const cancelAddProduct=document.getElementById('cancelAddProduct');
const createProduct=document.getElementById('createProduct');
const newName=document.getElementById('newName');
const newPrice=document.getElementById('newPrice');
const newPriceLabel=document.getElementById('newPriceLabel');
const newDescription=document.getElementById('newDescription');
const newImage=document.getElementById('newImage');
const newAvailable=document.getElementById('newAvailable');
const addProductStatus=document.getElementById('addProductStatus');

showAddProduct.onclick=()=>{
  addProductPanel.hidden=false;
  addProductStatus.textContent="";
  newName.focus();
};

cancelAddProduct.onclick=()=>{
  addProductPanel.hidden=true;
  addProductStatus.textContent="";
};

createProduct.onclick=async()=>{
  const name=newName.value.trim();
  const price=Number(newPrice.value);
  const priceLabel=newPriceLabel.value.trim();
  const description=newDescription.value.trim();
 const imageFile=newImage.files[0];

if(imageFile && !['image/jpeg','image/png','image/webp'].includes(imageFile.type)){
  addProductStatus.textContent="Please choose a JPG, PNG, or WebP image.";
  return;
}

if(imageFile && imageFile.size > 5 * 1024 * 1024){
  addProductStatus.textContent="Image must be 5 MB or smaller.";
  return;
}

  if(!name){
    addProductStatus.textContent="Please enter a product name.";
    return;
  }

  if(newPrice.value==="" || !Number.isFinite(price) || price < 0){
    addProductStatus.textContent="Please enter a valid price.";
    return;
  }

  createProduct.disabled=true;
  addProductStatus.textContent="Adding product…";

  const nextSort=items.length
    ? Math.max(...items.map(p=>Number(p.sort_order)||0))+1
    : 1;
const newProductId=crypto.randomUUID();
let imageUrl = "";

if(imageFile){
  addProductStatus.textContent="Uploading image…";

  const extension=imageFile.name.split('.').pop().toLowerCase();
 
  const filePath=`${newProductId}-${Date.now()}.${extension}`;

  const {error:uploadError}=await db.storage
    .from('product-images')
    .upload(filePath,imageFile,{
      cacheControl:'3600',
      upsert:false,
      contentType:imageFile.type
    });

  if(uploadError){
    createProduct.disabled=false;
    addProductStatus.textContent="Image upload error: "+uploadError.message;
    return;
  }

  const {data:publicData}=db.storage
    .from('product-images')
    .getPublicUrl(filePath);

  imageUrl=publicData.publicUrl;
}
const {error}=await db.from('products').insert({
    id: crypto.randomUUID(),
    id: newProductId,
    name:name,
    price:price,
    price_label:priceLabel,
    description:description,
    image:imageUrl,
    available:newAvailable.checked,
    sort_order:nextSort
  });

  createProduct.disabled=false;

  if(error){
    addProductStatus.textContent="Error: "+error.message;
    return;
  }

  addProductStatus.textContent="Product added successfully.";

  newName.value="";
  newPrice.value="";
  newPriceLabel.value="";
  newDescription.value="";
  newImage.value="";
  newAvailable.checked=true;

  await load();

  setTimeout(()=>{
    addProductPanel.hidden=true;
    addProductStatus.textContent="";
  },1200);
};
sessionUI();
</script></body></html> <!-- Pages redeploy 2026-10-05 -->
